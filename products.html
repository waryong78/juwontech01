<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 제품 | 주원테크</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50">

    <div id="site-topbar"></div>
    <div id="site-nav"></div>

    <section class="py-20 bg-white">
        <div class="container mx-auto px-6">
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-slate-900 mb-4">전체 제품 목록</h2>
                <div class="w-16 h-1 bg-blue-600 mx-auto mb-4"></div>
                <p class="text-slate-500">주원테크의 모든 제품을 확인하세요.</p>
            </div>

            <!-- Category Filter Tabs -->
            <div class="overflow-x-auto mb-10">
                <div id="filter-tabs" class="flex space-x-2 min-w-max pb-2">
                    <!-- JS로 렌더링 -->
                </div>
            </div>

            <!-- Product Count -->
            <p id="product-count" class="text-sm text-slate-400 mb-6"></p>

            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- JS로 렌더링 -->
            </div>

            <!-- 문의 카드 (항상 마지막에 표시) -->
            <div class="mt-10 border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center p-10 text-center hover:border-blue-400 transition-all duration-300">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-4">
                    <i class="fas fa-headset text-blue-600 text-2xl"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-700 mb-2">맞춤 제품 문의</h3>
                <p class="text-sm text-slate-500 mb-6">원하시는 규격이 없으신가요?<br>별도 규격 제작이 가능합니다.</p>
                <a href="index.html#contact" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">문의하기</a>
            </div>
        </div>
    </section>

    <div id="site-footer"></div>

<script src="components.js"></script>
<script src="products-data.js"></script>
<script>
let activeCategory = '전체';

function renderTabs() {
    const container = document.getElementById('filter-tabs');
    container.innerHTML = categories.map(cat => {
        const count = cat.id === '전체'
            ? products.length
            : products.filter(p => p.category === cat.id).length;
        const isActive = cat.id === activeCategory;
        return `
            <button
                onclick="setCategory('${cat.id}')"
                class="px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all duration-200 ${
                    isActive
                        ? 'bg-blue-600 text-white shadow'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }"
            >
                ${cat.label} <span class="ml-1 opacity-70">${count}</span>
            </button>
        `;
    }).join('');
}

function renderProducts() {
    const filtered = activeCategory === '전체'
        ? products
        : products.filter(p => p.category === activeCategory);

    document.getElementById('product-count').textContent = `총 ${filtered.length}개 제품`;

    document.getElementById('product-grid').innerHTML = filtered.map(p => `
        <a href="product-detail.html?id=${encodeURIComponent(p.id)}"
            class="group border rounded-2xl overflow-hidden hover:border-blue-500 transition-all duration-300 shadow-sm hover:shadow-xl bg-white block">
            <div class="bg-slate-100 h-52 flex items-center justify-center p-6 relative">
                <img
                    src="${p.image}"
                    alt="${p.name}"
                    class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-300"
                    onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%23e2e8f0%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%2212%22>No Image</text></svg>'"
                >
                <span class="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition bg-black/50 text-white text-xs px-2 py-0.5 rounded-full">
                    <i class="fas fa-arrow-right mr-1"></i>상세보기
                </span>
            </div>
            <div class="p-4">
                <span class="text-blue-600 text-xs font-bold">${p.category}</span>
                <h3 class="text-sm font-bold mt-1 text-slate-800">${p.name}</h3>
                <span class="mt-3 block text-center text-xs font-bold text-blue-600 border border-blue-200 rounded-lg py-1.5 group-hover:bg-blue-50 transition">
                    상세보기
                </span>
            </div>
        </a>
    `).join('');
}

function setCategory(categoryId) {
    activeCategory = categoryId;
    renderTabs();
    renderProducts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderTabs();
renderProducts();
</script>

</body>
</html>
